<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monochrome tray icon, drawn to the Breeze convention: the shapes paint with
  currentColor and take it from the stylesheet below, which KDE rewrites to
  the colour scheme in use.  That is what lets one icon suit a light and a
  dark panel instead of staying one fixed colour.

  Copyright (C) 2026 Jakob Flierl <jakob.flierl@gmail.com>
  Licensed under the GNU Lesser General Public License, version 2.1 or later.
-->
<svg viewBox="0 0 22 22" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
    <style id="current-color-scheme" type="text/css">
        .ColorScheme-Text {
            color:#232629;
        }
    </style>
    <g class="ColorScheme-Text" fill="currentColor">
        <!-- The cap of the 3D mouse, seen from the front. -->
        <path d="m11 5c-3.314 0-6 1.343-6 3v3c0 1.657 2.686 3 6 3s6-1.343 6-3v-3c0-1.657-2.686-3-6-3z"/>
        <!-- Its weighted base. -->
        <path d="m4.2 15.1c-1.9 0.5-3.2 1.3-3.2 2.2 0 1.5 4.5 2.7 10 2.7s10-1.2 10-2.7c0-0.9-1.3-1.7-3.2-2.2-1.7 0.8-4.1 1.3-6.8 1.3s-5.1-0.5-6.8-1.3z"/>
    </g>
</svg>
